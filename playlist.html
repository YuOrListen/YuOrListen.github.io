<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListenYU.ListenEcho</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: skyblue;
        }

        .shell {
            width: 90%;
            height: 700px;
            display: flex;
        }

        .box {
            flex: 1;
            overflow: hidden;
            transition: .5s;
            margin: 0 20px;
            box-shadow: 10px 10px 20px black;
            border: 10px solid #fff;
            border-radius: 20px;
            background-color: #fff;
            position: relative;
            transform: rotateY(90deg);
            opacity: 0;
            animation: flipOpen 0.8s ease forwards;
        }

        .box:nth-child(1) {
            animation-delay: 0.1s;
        }

        .box:nth-child(2) {
            animation-delay: 0.2s;
        }

        .box:nth-child(3) {
            animation-delay: 0.3s;
        }

        .box:nth-child(4) {
            animation-delay: 0.4s;
        }

        .box:nth-child(5) {
            animation-delay: 0.5s;
        }

        @keyframes flipOpen {
            0% {
                transform: rotateY(90deg);
                opacity: 0;
            }

            100% {
                transform: rotateY(0deg);
                opacity: 1;
            }
        }

        .link-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85%;
            z-index: 10;
            text-decoration: none;
        }

        .music-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            color: mistyrose;
            text-shadow: 0 0 10px #000;
            opacity: 0;
            transition: 0.4s ease;
            pointer-events: none;
        }

        .box:hover .music-icon {
            opacity: 1;
        }

        .box>img {
            width: 200%;
            height: 85%;
            object-fit: cover;
            transition: .5s;
        }

        .box>span {
            font: 200 45px 'Cascadia Code';
            text-align: center;
            height: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box:hover {
            flex-basis: 40%;
        }

        .box:hover>img {
            width: 100%;
            height: 100%;
        }

        .back-circle {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 24px;
            color: #333;
            z-index: 999;
            transition: 0.3s ease;
        }

        .back-circle:hover {
            background: #f0f0f0;
            transform: scale(1.08);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-circle">←</a>

    <div class="shell">
        <div class="box">
            <a href="kpop.html" class="link-area">
                <div class="music-icon">♪</div>
            </a>
            <img src="picture/kpop.jpg">
            <span>K-POP</span>
        </div>
        <div class="box">
            <a href="R&B.html" class="link-area">
                <div class="music-icon">♪</div>
            </a>
            <img src="picture/R&B.jpg">
            <span>R&B</span>
        </div>
        <div class="box">
            <a href="mpop.html" class="link-area">
                <div class="music-icon">♪</div>
            </a>
            <img src="picture/mpop.jpg">
            <span>M-POP</span>
        </div>
        <div class="box">
            <a href="western.html" class="link-area">
                <div class="music-icon">♪</div>
            </a>
            <img src="picture/western.jpg">
            <span>Western</span>
        </div>
        <div class="box">
            <a href="jpop.html" class="link-area">
                <div class="music-icon">♪</div>
            </a>
            <img src="picture/jpop.jpg">
            <span>J-POP</span>
        </div>
    </div>
</body>

</html>
