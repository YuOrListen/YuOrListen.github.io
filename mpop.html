<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListenEcho | K-POP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="playlist.html" class="back-circle">←</a>

    <div class="shell">
        <input type="radio" name="music" id="item-1" checked>
        <input type="radio" name="music" id="item-2">
        <input type="radio" name="music" id="item-3">

        <div class="cards">
            <label class="card" for="item-1" id="song-1">
                <img src="picture/song7.jpg" alt="歌曲封面">
            </label>
            <label class="card" for="item-2" id="song-2">
                <img src="picture/song8.jpg" alt="歌曲封面">
            </label>
            <label class="card" for="item-3" id="song-3">
                <img src="picture/song9.jpg" alt="歌曲封面">
            </label>
        </div>

        <div class="player">
            <div class="information">
                <div>
                    <img src="" style="width: 40px;margin-top: 5px;">
                </div>
                <div class="info-area" id="test">
                    <div class="song-info">
                        <div class="title">普通人类</div>
                        <div class="Subheading">
                            <div class="singer">张艺兴</div>
                            <div class="time">03:10</div>
                        </div>
                    </div>
                    <div class="song-info">
                        <div class="title">Tasty</div>
                        <div class="Subheading">
                            <div class="singer">R.E.D</div>
                            <div class="time">02:36</div>
                        </div>
                    </div>
                    <div class="song-info">
                        <div class="title">没什么能给你</div>
                        <div class="Subheading">
                            <div class="singer">张艺兴</div>
                            <div class="time">04:14</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="progress-wrap">
                <div class="progress-bar" id="progressBar">
                    <span class="progress" id="progress"></span>
                </div>
            </div>
            <div class="time-text">
                <span id="currentTime">00:00</span>
                <span id="totalTime">00:00</span>
            </div>

            <div class="controls">
                <button id="prevBtn">⏮</button>
                <button id="playBtn" class="play-btn">▶</button>
                <button id="nextBtn">⏭</button>
            </div>
        </div>
    </div>

    <audio id="audio">
        <source src="music/song7.mp3" type="audio/mpeg">


        <script>
            const audio = document.getElementById('audio');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const progressBar = document.getElementById('progressBar');
            const progress = document.getElementById('progress');
            const radios = document.querySelectorAll('input[name="music"]');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');

            const musicList = [
                'music/song7.mp3',
                'music/song8.mp3',
                'music/song9.mp3'
            ];
            let currentIndex = 0;
            let isPlay = false;
            function formatTime(sec) {
                if (isNaN(sec)) return "00:00";
                let m = Math.floor(sec / 60);
                let s = Math.floor(sec % 60);
                m = m < 10 ? '0' + m : m;
                s = s < 10 ? '0' + s : s;
                return m + ':' + s;
            }

            function switchSong(index) {
                currentIndex = index;
                audio.src = musicList[currentIndex];
                radios[index].checked = true;
                audio.addEventListener('loadedmetadata', function () {
                    totalTimeEl.textContent = formatTime(audio.duration);
                }, { once: true });
                if (isPlay) audio.play();
            }

            playBtn.addEventListener('click', () => {
                if (isPlay) {
                    audio.pause();
                    playBtn.textContent = '▶';
                } else {
                    audio.play();
                    playBtn.textContent = '⏸';
                }
                isPlay = !isPlay;
            });

            prevBtn.addEventListener('click', () => {
                currentIndex--;
                if (currentIndex < 0) currentIndex = musicList.length - 1;
                switchSong(currentIndex);
            });

            nextBtn.addEventListener('click', () => {
                currentIndex++;
                if (currentIndex >= musicList.length) currentIndex = 0;
                switchSong(currentIndex);
            });

            radios.forEach((radio, index) => {
                radio.addEventListener('change', () => {
                    switchSong(index);
                });
            });

            audio.addEventListener('timeupdate', () => {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            });

            progressBar.addEventListener('click', (e) => {
                const barWidth = progressBar.offsetWidth;
                const clickX = e.offsetX;
                const jumpTime = (clickX / barWidth) * audio.duration;
                audio.currentTime = jumpTime;
            });

            audio.addEventListener('ended', () => {
                nextBtn.click();
            });

            audio.addEventListener('loadedmetadata', function () {
                totalTimeEl.textContent = formatTime(audio.duration);
            }, { once: true });
        </script>
</body>

</html>
